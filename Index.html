function renderQuestions() {
    const container = document.getElementById("questionsContainer");
    let html = "";
    quizData.forEach((q, index) => {
        html += `
        <div class="question-card" id="card-${q.id}">
            <div class="question-title">Q${q.id}. ${q.text}</div>
            <div class="options-group">
                ${q.options.map((opt, optIdx) => `
                    <label class="option-label" id="label-${q.id}-${optIdx + 1}">
                        <input type="radio" name="q${q.id}" value="${optIdx + 1}" onchange="markOption(${q.id}, ${optIdx + 1}, ${q.answer})">
                        ${optIdx + 1}) ${opt}
                    </label>
                `).join('')}
            </div>
        </div>`;
    });
    container.innerHTML = html;
}

function markOption(qId, selectedOpt, correctOpt) {
    // Reset background styles for current question options
    for (let i = 1; i <= 4; i++) {
        const lbl = document.getElementById(`label-${qId}-${i}`);
        lbl.classList.remove('correct', 'incorrect');
    }

    const selectedLabel = document.getElementById(`label-${qId}-${selectedOpt}`);
    if (selectedOpt === correctOpt) {
        selectedLabel.classList.add('correct');
    } else {
        selectedLabel.classList.add('incorrect');
        // Show correct answer in green as well
        const correctLabel = document.getElementById(`label-${qId}-${correctOpt}`);
        correctLabel.classList.add('correct');
    }
}

function evaluateExam() {
    let attempted = 0;
    let correct = 0;
    let wrong = 0;

    quizData.forEach(q => {
        const selected = document.querySelector(`input[name="q${q.id}"]:checked`);
        if (selected) {
            attempted++;
            if (parseInt(selected.value) === q.answer) {
                correct++;
            } else {
                wrong++;
            }
        }
    });

    const totalScore = (correct * 1.0) - (wrong * 0.20);

    document.getElementById("res-attempted").innerText = attempted;
    document.getElementById("res-correct").innerText = correct;
    document.getElementById("res-wrong").innerText = wrong;
    document.getElementById("res-score").innerText = totalScore.toFixed(2);
    document.getElementById("result-board").style.display = "block";

    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
}
